# Optional unauthenticated read/write browser UI for a LOCAL cluster only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: ghcr.io/kafbat/kafka-ui:v1.3.0
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: rent-cars-local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: rent-kafka-bootstrap:9092
            - name: KAFKA_CLUSTERS_0_READONLY
              value: 'false'
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  type: LoadBalancer
  selector:
    app: kafka-ui
  ports:
    - port: 8084
      targetPort: 8080
