api:
  image:
    repository: docker.io/guuhworship/rent-cars-api
    tag: latest
    pullPolicy: Always
  # Include demo cars and the development admin in this local chart.
  flywayLocations: classpath:db/migration,classpath:db/dev
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

web:
  service:
    type: LoadBalancer
    port: 8082
  image:
    repository: docker.io/guuhworship/rent-cars-web
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

postgres:
  image: postgres:17-bookworm
  storage: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Pre-create this Secret in the release namespace (see README).
existingSecret: rent-cars-credentials
imagePullSecrets: []
ingress:
  enabled: false
  className: nginx
  host: rent-cars.localhost

# Local development S3-compatible storage. Disable when using an external S3 bucket.
s3Emulator:
  enabled: true
  image: chrislusf/seaweedfs:4.52
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

mailpit:
  image: axllent/mailpit:v1.32.0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

mail:
  from: no-reply@rent-cars.local
  webBaseUrl: http://localhost:8082

storage:
  bucket: rent-cars-images
  region: us-east-1
  # Defaults match the fleet release used by make k8s-up.
  # For another release name, update endpoint and credentialsSecret together.
  endpoint: http://fleet-s3:8333
  pathStyle: true
  credentialsSecret: fleet-s3
