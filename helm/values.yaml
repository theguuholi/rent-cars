api:
  avatarStorage: 1Gi
  storage:
    provider: local # local, s3 or gcs; do not switch existing data without copying objects first
    bucket: ""
    region: "" # required for s3
  serviceAccount:
    name: "" # existing cloud workload identity service account
    automountToken: false
  image:
    repository: docker.io/guuhworship/rent-cars-api
    tag: latest
    pullPolicy: Always
  demoData: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

web:
  service:
    type: ClusterIP
    port: 8080
  image:
    repository: docker.io/guuhworship/rent-cars-web
    tag: latest
    pullPolicy: Always
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

postgres:
  image: postgres:17-bookworm
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Pre-create this Secret in the release namespace (see README).
existingSecret: rent-cars-credentials
imagePullSecrets: []
ingress:
  enabled: false
  className: nginx
  host: rent-cars.localhost
