# Local learning only: one broker/controller, no replication or authentication.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: rent
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: rent
spec:
  kafka:
    version: 4.1.1
    metadataVersion: 4.1-IV1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: rentals-events
  labels:
    strimzi.io/cluster: rent
spec:
  topicName: rentals.events
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: rentals-events-recommendations-dlt
  labels:
    strimzi.io/cluster: rent
spec:
  topicName: rentals.events.recommendations.DLT
  partitions: 3
  replicas: 1
  config:
    retention.ms: 1209600000
    min.insync.replicas: 1
    cleanup.policy: delete
