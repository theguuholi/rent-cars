{{- if and .Values.messaging.enabled .Values.recommendations.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-recommendations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: recommendations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: recommendations
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- if .Values.hdfs.enabled }}
      initContainers:
        - name: wait-for-hdfs
          image: {{ .Values.hdfs.image | quote }}
          command: [bash, -ec]
          args:
            - >-
              until curl --fail --silent --max-time 5
              'http://{{ .Release.Name }}-hdfs-httpfs:14000/webhdfs/v1/?op=LISTSTATUS&user.name=hadoop'
              >/dev/null; do sleep 2; done
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      {{- end }}
      containers:
        - name: recommendations
          image: "{{ .Values.recommendations.image.repository }}:{{ .Values.recommendations.image.tag }}"
          imagePullPolicy: {{ .Values.recommendations.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{ toYaml .Values.recommendations.resources | nindent 12 }}
          env:
            - name: HDFS_ARCHIVE_ENABLED
              value: {{ .Values.hdfs.enabled | quote }}
            - name: HDFS_HTTPFS_URL
              value: {{ printf "http://%s-hdfs-httpfs:14000" .Release.Name | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.messaging.bootstrapServers | quote }}
            - name: RENT_MESSAGING_TOPIC
              value: {{ .Values.messaging.topic | quote }}
            - name: RENT_MESSAGING_DLT
              value: {{ .Values.messaging.deadLetterTopic | quote }}
            - name: RECOMMENDATIONS_GROUP_ID
              value: {{ .Values.recommendations.groupId | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
