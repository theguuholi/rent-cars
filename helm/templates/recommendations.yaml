{{- if and .Values.messaging.enabled .Values.recommendations.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-recommendations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: recommendations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: recommendations
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        - name: create-recommendations-database
          image: {{ .Values.postgres.image | quote }}
          command: [sh, /study/create-database.sh]
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: PGHOST
              value: {{ .Release.Name }}-postgres
            - name: PGUSER
              value: rent_cars
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
          volumeMounts:
            - name: database-init
              mountPath: /study
      {{- if .Values.hdfs.enabled }}
        - name: wait-for-hdfs
          image: {{ .Values.hdfs.image | quote }}
          command: [bash, -ec]
          args:
            - >-
              until curl --fail --silent --max-time 5
              'http://{{ .Release.Name }}-hdfs-httpfs:14000/webhdfs/v1/?op=LISTSTATUS&user.name=hadoop'
              >/dev/null; do sleep 2; done
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      {{- end }}
      containers:
        - name: recommendations
          image: "{{ .Values.recommendations.image.repository }}:{{ .Values.recommendations.image.tag }}"
          imagePullPolicy: {{ .Values.recommendations.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{ toYaml .Values.recommendations.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 10
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: RECOMMENDATIONS_DATABASE_URL
              value: jdbc:postgresql://{{ .Release.Name }}-postgres:5432/recommendations
            - name: RECOMMENDATIONS_DATABASE_USER
              value: rent_cars
            - name: RECOMMENDATIONS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            - name: HDFS_ARCHIVE_ENABLED
              value: {{ .Values.hdfs.enabled | quote }}
            - name: HDFS_HTTPFS_URL
              value: {{ printf "http://%s-hdfs-httpfs:14000" .Release.Name | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.messaging.bootstrapServers | quote }}
            - name: RENT_MESSAGING_TOPIC
              value: {{ .Values.messaging.topic | quote }}
            - name: RENT_MESSAGING_DLT
              value: {{ .Values.messaging.deadLetterTopic | quote }}
            - name: RECOMMENDATIONS_GROUP_ID
              value: {{ .Values.recommendations.groupId | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: database-init
          configMap:
            name: {{ .Release.Name }}-recommendations-db-init
        - name: tmp
          emptyDir: {}
{{- end }}

{{- if and .Values.messaging.enabled .Values.recommendations.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-recommendations
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: recommendations
  ports:
    - name: http
      port: 8085
      targetPort: http
{{- end }}
