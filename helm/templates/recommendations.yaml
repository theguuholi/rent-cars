{{- if and .Values.messaging.enabled .Values.recommendations.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-recommendations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: recommendations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: recommendations
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: recommendations
          image: "{{ .Values.recommendations.image.repository }}:{{ .Values.recommendations.image.tag }}"
          imagePullPolicy: {{ .Values.recommendations.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{ toYaml .Values.recommendations.resources | nindent 12 }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.messaging.bootstrapServers | quote }}
            - name: RENT_MESSAGING_TOPIC
              value: {{ .Values.messaging.topic | quote }}
            - name: RECOMMENDATIONS_GROUP_ID
              value: {{ .Values.recommendations.groupId | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
