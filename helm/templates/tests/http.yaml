apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-http-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 4 }}
  containers:
    - name: http
      image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
      imagePullPolicy: {{ .Values.web.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - "/bin/sh"
        - "-ec"
      args:
        - |
          url=http://{{ .Release.Name }}-web:{{ .Values.web.service.port }}
          page=$(wget -T 5 -qO- "$url/cars/review/edit")
          echo "$page" | grep -q 'id="root"'
          # Service endpoints can take a moment to converge after a rollout.
          for attempt in 1 2 3 4 5; do
            if cars=$(wget -T 5 -qO- "$url/api/cars"); then break; fi
            sleep 1
          done
          echo "$cars" | grep -q '^\['
          echo "React deep link and fleet API passed."
