{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-observability
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: observability
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.observability.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: observability
          image: {{ .Values.observability.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.observability.resources | nindent 12 }}
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-http, containerPort: 4318}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
          startupProbe:
            exec:
              command: [sh, -c, 'test -f /tmp/ready']
            periodSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [sh, -c, 'test -f /tmp/ready']
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tempo, mountPath: /var/tempo}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-observability
        - name: tempo
          emptyDir: {}
{{- end }}
