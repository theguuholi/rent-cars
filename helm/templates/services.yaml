{{- range $component := list "api" "web" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  selector:
    {{- include "rent-cars.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
