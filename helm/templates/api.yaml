apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SPRING_MAIL_HOST
              value: {{ .Release.Name }}-mailpit
            - name: SPRING_MAIL_PORT
              value: '1025'
            - name: RENT_MAIL_FROM
              value: {{ .Values.mail.from | quote }}
            - name: RENT_MAIL_WEB_BASE_URL
              value: {{ .Values.mail.webBaseUrl | quote }}
            - name: RENT_STORAGE_S3_BUCKET
              value: {{ .Values.storage.bucket | quote }}
            - name: RENT_STORAGE_S3_REGION
              value: {{ .Values.storage.region | quote }}
            - name: RENT_STORAGE_S3_ENDPOINT
              value: {{ .Values.storage.endpoint | quote }}
            - name: RENT_STORAGE_S3_PATH_STYLE
              value: {{ .Values.storage.pathStyle | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.credentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.credentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Release.Name }}-postgres:5432/rent_cars
            - name: SPRING_FLYWAY_CONNECT_RETRIES
              value: '10'
            - name: SPRING_DATASOURCE_USERNAME
              value: rent_cars
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            - name: RENT_AUTH_PRIVATE_KEY
              value: file:/keys/private.pem
            - name: RENT_AUTH_PUBLIC_KEY
              value: file:/keys/public.pem
            - name: SPRING_FLYWAY_LOCATIONS
              value: {{ .Values.api.flywayLocations | quote }}
          startupProbe:
            httpGet:
              path: "/csrf"
              port: http
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: "/csrf"
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: tmp
              mountPath: "/tmp"
            - name: keys
              mountPath: "/keys"
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: keys
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: private.pem
                path: private.pem
              - key: public.pem
                path: public.pem
