apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rent-cars.labels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "rent-cars.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext: {{ include "rent-cars.containerSecurity" . | nindent 12 }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: local}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/rent_cars"}
            - {name: SPRING_FLYWAY_CONNECT_RETRIES, value: "10"}
            - {name: SPRING_DATASOURCE_USERNAME, value: rent_cars}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: postgres-password}
            - {name: RENT_AUTH_PRIVATE_KEY, value: "file:/keys/private.pem"}
            - {name: RENT_AUTH_PUBLIC_KEY, value: "file:/keys/public.pem"}
            {{- if .Values.api.demoData }}
            - {name: SPRING_FLYWAY_LOCATIONS, value: "classpath:db/migration,classpath:db/dev"}
            {{- end }}
          startupProbe:
            httpGet: {path: /csrf, port: http}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /csrf, port: http}
          livenessProbe:
            tcpSocket: {port: http}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: keys, mountPath: /keys, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: keys
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - {key: private.pem, path: private.pem}
              - {key: public.pem, path: public.pem}
