{{- if and .Values.messaging.enabled .Values.recommendations.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-recommendations-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: recommendations-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-recommendations-db
spec:
  serviceName: {{ .Release.Name }}-recommendations-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: recommendations-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: recommendations-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: recommendations
            - name: POSTGRES_USER
              value: recommendations
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.recommendations.existingSecret }}
                  key: postgres-password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-h"
                - 127.0.0.1
                - "-U"
                - recommendations
                - "-d"
                - recommendations
          volumeMounts:
            - name: data
              mountPath: "/var/lib/postgresql/data"
            - name: run
              mountPath: "/var/run/postgresql"
            - name: tmp
              mountPath: "/tmp"
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}

{{- end }}
