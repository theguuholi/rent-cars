name: Playwright journeys
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/e2e/**'
      - 'apps/web/src/**'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package*.json'
      - '.github/workflows/playwright-public-api.yml'
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/web/e2e/**'
      - 'apps/web/src/**'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package*.json'
      - '.github/workflows/playwright-public-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Generate local API signing keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          echo "RENT_AUTH_PRIVATE_KEY=file:$RUNNER_TEMP/private.pem" >> "$GITHUB_ENV"
          echo "RENT_AUTH_PUBLIC_KEY=file:$RUNNER_TEMP/public.pem" >> "$GITHUB_ENV"
      - name: Test public API and browser journeys
        run: |
          make dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8080/cars > /dev/null && curl --fail --silent http://localhost:5173/cars > /dev/null; then
              break
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              tail -100 "$RUNNER_TEMP/dev.log"
              exit 1
            fi
            sleep 2
          done
          if ! curl --fail --silent http://localhost:8080/cars > /dev/null || ! curl --fail --silent http://localhost:5173/cars > /dev/null; then
            tail -100 "$RUNNER_TEMP/dev.log"
            exit 1
          fi
          npm --prefix apps/web run test:public-api
          npm --prefix apps/web run test:browser
