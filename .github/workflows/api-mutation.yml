name: API / Mutation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  mutation-packages:
    name: Discover API mutation packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: packages
        run: echo "matrix=$(python3 scripts/ci/api_mutation_matrix.py)" >> "$GITHUB_OUTPUT"

  mutation:
    name: API mutation (${{ matrix.name }})
    needs: mutation-packages
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.mutation-packages.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Mutate this package using the full API test suite
        working-directory: apps/api
        env:
          MUTATION_TARGETS: ${{ matrix.targets }}
        run: ./mvnw -B -Pmutation -DtargetClasses="$MUTATION_TARGETS" test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-api-${{ matrix.name }}
          path: apps/api/target/pit-reports/
          if-no-files-found: error
