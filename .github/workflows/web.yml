name: Frontend CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Web verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Verify frontend formatting, lint, coverage and build
        working-directory: .
        run: make check-web
      - name: Upload HTML and LCOV reports
        if: always() && hashFiles('apps/web/coverage/lcov.info') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: apps/web/coverage/
          if-no-files-found: warn

  mutation:
    name: Web mutation analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Test mutations in changed Web source
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- apps/web/src |
            awk '/^apps\/web\/src\/.*\.(ts|tsx)$/ && !/\.test\.(ts|tsx)$/ && !/\.d\.ts$/ && !/^apps\/web\/src\/test\// { sub(/^apps\/web\//, ""); print }' |
            paste -sd, -)
          if [ -z "$changed" ]; then
            echo "No changed Web production source to mutate."
          else
            echo "Mutating: $changed"
            npm run mutation -- --mutate "$changed"
          fi
      - name: Full mutation analysis
        if: github.event_name != 'pull_request'
        run: npm run mutation
      - name: Upload mutation reports
        if: always() && hashFiles('apps/web/reports/mutation/*.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-mutation
          path: apps/web/reports/mutation/
          if-no-files-found: error

  api-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install chromium
        working-directory: apps/web
      - name: Generate local API signing keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          echo "RENT_AUTH_PRIVATE_KEY=file:$RUNNER_TEMP/private.pem" >> "$GITHUB_ENV"
          echo "RENT_AUTH_PUBLIC_KEY=file:$RUNNER_TEMP/public.pem" >> "$GITHUB_ENV"
      - name: Test public API and browser journeys
        run: |
          make dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8080/cars > /dev/null && curl --fail --silent http://localhost:5173/cars > /dev/null && curl --fail --silent http://localhost:8025/api/v1/messages > /dev/null; then
              break
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              tail -100 "$RUNNER_TEMP/dev.log"
              exit 1
            fi
            sleep 2
          done
          if ! curl --fail --silent http://localhost:8080/cars > /dev/null || ! curl --fail --silent http://localhost:5173/cars > /dev/null || ! curl --fail --silent http://localhost:8025/api/v1/messages > /dev/null; then
            tail -100 "$RUNNER_TEMP/dev.log"
            exit 1
          fi
          npm --prefix apps/web run test:e2e
