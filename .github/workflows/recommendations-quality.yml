name: Recommendations / Quality
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Recommendations verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/recommendations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/recommendations/pom.xml
      - name: Check formatting, run tests and generate coverage
        working-directory: .
        run: make check-recommendations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-recommendations
          path: apps/recommendations/target/site/jacoco/
          if-no-files-found: error
      - name: Provision recommendations Sonar project with the API quality policy
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_API_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_RECOMMENDATIONS_PROJECT_KEY }}
        run: ./scripts/ci/provision-recommendations-sonar.sh
      - name: Analyze code and wait for the Sonar quality gate
        id: sonar
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_RECOMMENDATIONS_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          : "${SONAR_TOKEN:?Configure the Sonar token in repository secrets}"
          : "${SONAR_PROJECT_KEY:?Configure the Sonar project key in repository variables}"
          : "${SONAR_ORGANIZATION:?Configure the Sonar organization in repository variables}"
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
      - name: Explain the failed Sonar analysis
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          report=target/sonar/report-task.txt
          if [[ ! -s "$report" ]]; then
            echo 'Sonar produced no analysis report. Check the scanner log above.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          task_id=$(sed -n 's/^ceTaskId=//p' "$report")
          dashboard=$(sed -n 's/^dashboardUrl=//p' "$report")
          echo "### [Sonar analysis]($dashboard)" >> "$GITHUB_STEP_SUMMARY"
          sonar_api() {
            local endpoint="$1"
            local parameter="$2"
            curl --fail --silent --show-error --max-time 20 --retry 2 \
              -H "Authorization: Bearer $SONAR_TOKEN" --get \
              "https://sonarcloud.io/api/$endpoint" --data-urlencode "$parameter"
          }
          task=$(sonar_api ce/task "id=$task_id")
          analysis_id=$(jq -r '.task.analysisId // empty' <<< "$task")
          if [[ -z "$analysis_id" ]]; then
            jq -r '"Analysis task status: " + .task.status' <<< "$task" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sonar_api qualitygates/project_status "analysisId=$analysis_id" |
            jq -r '.projectStatus | "Gate status: " + .status,
              (.conditions[] | select(.status == "ERROR") |
               "- `\(.metricKey)`: measured \(.actualValue), failure threshold \(.comparator) \(.errorThreshold)")' >> "$GITHUB_STEP_SUMMARY"


  infrastructure:
    name: Infrastructure verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the chart's tested Helm version
        env:
          HELM_VERSION: v4.3.1
        run: |
          cd "$RUNNER_TEMP"
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location "https://get.helm.sh/$archive" --output "$archive"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location "https://get.helm.sh/$archive.sha256sum" --output "$archive.sha256sum"
          sha256sum --check "$archive.sha256sum"
          tar -xzf "$archive"
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Test deployment and publication contracts
        run: make check-infra
      - name: Validate chart, shell and Compose definitions
        run: |
          helm lint ./helm --strict
          sh -n scripts/push-images.sh
          docker compose --profile recommendations config --quiet
          docker compose -f compose.stack.yaml --profile recommendations config --quiet
