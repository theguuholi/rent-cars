name: Infrastructure quality
on:
  pull_request:
    paths: ['helm/**', 'scripts/push-images.sh', 'scripts/tests/**', 'scripts/ci/**', '.github/workflows/merge-readiness.yml', 'Makefile', 'compose*.yaml', '.github/workflows/infrastructure.yml']
  push:
    branches: [master]
    paths: ['helm/**', 'scripts/push-images.sh', 'scripts/tests/**', 'scripts/ci/**', '.github/workflows/merge-readiness.yml', 'Makefile', 'compose*.yaml', '.github/workflows/infrastructure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Infrastructure verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the chart's tested Helm version
        env:
          HELM_VERSION: v4.3.1
        run: |
          cd "$RUNNER_TEMP"
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location "https://get.helm.sh/$archive" --output "$archive"
          curl --fail --silent --show-error --location "https://get.helm.sh/$archive.sha256sum" --output "$archive.sha256sum"
          sha256sum --check "$archive.sha256sum"
          tar -xzf "$archive"
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Test deployment and publication contracts
        run: make check-infra
      - name: Validate chart, shell and Compose definitions
        run: |
          helm lint ./helm --strict
          sh -n scripts/push-images.sh
          docker compose --profile recommendations config --quiet
          docker compose -f compose.stack.yaml --profile recommendations config --quiet
