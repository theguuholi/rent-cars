name: Development tooling
on:
  pull_request:
    paths:
      - 'scripts/development/**'
      - 'make/**'
      - 'Makefile'
      - '.github/workflows/development.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/development/**'
      - 'make/**'
      - 'Makefile'
      - '.github/workflows/development.yml'
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.node-version
      - run: |
          for script in scripts/development/*.sh; do bash -n "$script"; done
          make check-development
          make -n dev HDFS_ENABLED=true
