name: Recommendations / Mutation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

jobs:
  mutation:
    name: Recommendations mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/recommendations/pom.xml
      - name: Run mutation tests across recommendations
        working-directory: apps/recommendations
        run: ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-recommendations
          path: apps/recommendations/target/pit-reports/
          if-no-files-found: error
