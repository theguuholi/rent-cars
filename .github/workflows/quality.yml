name: Java quality
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Check formatting, run tests and generate coverage
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage
          path: api/target/site/jacoco/
          if-no-files-found: error
      - name: Analyze code and wait for the Sonar quality gate
        id: sonar
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          : "${SONAR_TOKEN:?Configure the Sonar token in repository secrets}"
          : "${SONAR_PROJECT_KEY:?Configure the Sonar project key in repository variables}"
          : "${SONAR_ORGANIZATION:?Configure the Sonar organization in repository variables}"
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
      - name: Explain the failed Sonar analysis
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          report=target/sonar/report-task.txt
          if [[ ! -s "$report" ]]; then
            echo 'Sonar produced no analysis report. Check the scanner log above.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          task_id=$(sed -n 's/^ceTaskId=//p' "$report")
          dashboard=$(sed -n 's/^dashboardUrl=//p' "$report")
          echo "### [Sonar analysis]($dashboard)" >> "$GITHUB_STEP_SUMMARY"
          sonar_api() {
            curl --fail --silent --show-error --max-time 20 --retry 2 \
              -H "Authorization: Bearer $SONAR_TOKEN" --get \
              "https://sonarcloud.io/api/$1" --data-urlencode "$2"
          }
          task=$(sonar_api ce/task "id=$task_id")
          analysis_id=$(jq -r '.task.analysisId // empty' <<< "$task")
          if [[ -z "$analysis_id" ]]; then
            jq -r '"Analysis task status: " + .task.status' <<< "$task" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sonar_api qualitygates/project_status "analysisId=$analysis_id" |
            jq -r '.projectStatus | "Gate status: " + .status,
              (.conditions[] | select(.status == "ERROR") |
               "- `\(.metricKey)`: measured \(.actualValue), failure threshold \(.comparator) \(.errorThreshold)")' >> "$GITHUB_STEP_SUMMARY"
