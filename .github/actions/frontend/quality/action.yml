name: Frontend quality
description: Run frontend quality checks and publish their reports.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: apps/web/.node-version
        cache: npm
        cache-dependency-path: apps/web/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: apps/web
    - name: Verify frontend formatting, lint, coverage and build
      shell: bash
      working-directory: apps/web
      run: |
        npm run format:check
        npm run lint
        npm run architecture
        npm run test:coverage
        npm run build
    - name: Upload HTML and LCOV reports
      if: always() && hashFiles('apps/web/coverage/lcov.info') != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: web-coverage
        path: apps/web/coverage/
        if-no-files-found: warn
