name: Frontend mutation
description: Run frontend mutation checks and publish their reports.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: apps/web/.node-version
        cache: npm
        cache-dependency-path: apps/web/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: apps/web
    - name: Test mutations in changed Web source
      shell: bash
      working-directory: .
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- apps/web/src |
          awk '/^apps\/web\/src\/.*\.(ts|tsx)$/ && !/\.test\.(ts|tsx)$/ && !/\.d\.ts$/ && !/^apps\/web\/src\/test\// { sub(/^apps\/web\//, ""); print }' |
          paste -sd, -)
        if [ -z "$changed" ]; then
          echo "No changed Web production source to mutate."
        else
          echo "Mutating: $changed"
          npm --prefix apps/web run mutation -- --mutate "$changed"
        fi
    - name: Full mutation analysis
      shell: bash
      working-directory: apps/web
      if: github.event_name != 'pull_request'
      run: npm run mutation
    - name: Upload mutation reports
      if: always() && hashFiles('apps/web/reports/mutation/*.html') != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: web-mutation
        path: apps/web/reports/mutation/
        if-no-files-found: error
