services:
  s3:
    image: chrislusf/seaweedfs:4.52
    command: [mini, -dir=/data, -ip=127.0.0.1, -ip.bind=0.0.0.0, -admin.ui=false, -webdav=false, -master.volumeSizeLimitMB=128, -volume.max=4]
    environment:
      AWS_ACCESS_KEY_ID: rent-cars-dev
      AWS_SECRET_ACCESS_KEY: rent-cars-dev-secret
      S3_BUCKET: rent-cars-images
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/buckets/rent-cars-images/"]
      interval: 3s
      timeout: 3s
      start_period: 15s
      retries: 30
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rent_cars_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "rent_cars_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  s3_data:
