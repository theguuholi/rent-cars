services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rent_cars_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "rent_cars_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data: