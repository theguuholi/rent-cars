services:
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null']
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic rentals.events --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic rentals.events.recommendations.DLT --partitions 3 --replication-factor 1 --config retention.ms=1209600000 --config min.insync.replicas=1 --config cleanup.policy=delete
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    profiles: [kafka-ui]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: rent-cars-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_READONLY: 'false'
    ports:
      - '127.0.0.1:${KAFKA_UI_PORT:-8084}:8080'
  observability:
    image: grafana/otel-lgtm:0.37.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - observability_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/api/v1/messages"]
      interval: 3s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.52
    command: [mini, -dir=/data, -ip=127.0.0.1, -ip.bind=0.0.0.0, -admin.ui=false, -webdav=false, -master.volumeSizeLimitMB=128, -volume.max=4]
    environment:
      AWS_ACCESS_KEY_ID: rent-cars-dev
      AWS_SECRET_ACCESS_KEY: rent-cars-dev-secret
      S3_BUCKET: rent-cars-images
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/buckets/rent-cars-images/"]
      interval: 3s
      timeout: 3s
      start_period: 15s
      retries: 30
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rent_cars_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "rent_cars_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  kafka_data:
  observability_data:
  postgres_data:
  s3_data:
