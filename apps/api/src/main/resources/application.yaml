spring:
  application:
    name: rent-cars-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false

rent:
  auth:
    private-key: ${RENT_AUTH_PRIVATE_KEY}
    public-key: ${RENT_AUTH_PUBLIC_KEY}

springdoc:
  swagger-ui:
    csrf:
      enabled: true

# Drain modestly oversized requests so clients can read the 413 response.
server:
  tomcat:
    max-swallow-size: 32MB
