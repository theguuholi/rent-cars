spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: rent-cars-api

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate

rent:
  auth:
    private-key: ${RENT_AUTH_PRIVATE_KEY}
    public-key: ${RENT_AUTH_PUBLIC_KEY}

springdoc:
  swagger-ui:
    csrf:
      enabled: true
