spring:
  application:
    name: rent-cars-api

  mail:
    properties:
      '[mail.smtp.connectiontimeout]': 5000
      '[mail.smtp.timeout]': 5000
      '[mail.smtp.writetimeout]': 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false

rent:
  mail:
    from: ${RENT_MAIL_FROM:no-reply@rent-cars.local}
    web-base-url: ${RENT_MAIL_WEB_BASE_URL:http://localhost:5173}
  auth:
    private-key: ${RENT_AUTH_PRIVATE_KEY}
    public-key: ${RENT_AUTH_PUBLIC_KEY}

springdoc:
  swagger-ui:
    csrf:
      enabled: true

# Drain modestly oversized requests so clients can read the 413 response.
server:
  tomcat:
    max-swallow-size: 32MB

management:
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: ${RENT_TRACING_SAMPLE_RATE:0.1}
    export:
      otlp:
        enabled: ${RENT_OBSERVABILITY_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${RENT_OBSERVABILITY_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        enabled: ${RENT_OBSERVABILITY_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

logging:
  structured:
    format:
      console: logstash
