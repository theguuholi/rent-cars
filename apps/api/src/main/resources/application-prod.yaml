spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      '[mail.smtp.auth]': true
      '[mail.smtp.starttls.enable]': true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    locations: classpath:db/migration

rent:
  mail:
    from: ${MAIL_FROM}
    web-base-url: ${WEB_BASE_URL}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_REGION}
