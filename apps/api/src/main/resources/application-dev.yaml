spring:
  mail:
    host: localhost
    port: 1025
  datasource:
    url: jdbc:postgresql://localhost:5432/rent_cars_dev
    username: postgres
    password: postgres
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev

rent:
  storage:
    s3:
      bucket: rent-cars-images
      region: us-east-1
      endpoint: http://localhost:8333
      path-style: true
  auth:
    secure-cookie: false

management:
  tracing:
    export:
      otlp:
        enabled: ${RENT_OBSERVABILITY_ENABLED:true}
  logging:
    export:
      otlp:
        enabled: ${RENT_OBSERVABILITY_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: ${RENT_OBSERVABILITY_ENABLED:true}
