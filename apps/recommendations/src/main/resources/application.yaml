spring:
  application:
    name: rent-cars-recommendations
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
    consumer:
      group-id: ${RECOMMENDATIONS_GROUP_ID:rent-cars-recommendations-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: record
      missing-topics-fatal: true
rent:
  messaging:
    topic: ${RENT_MESSAGING_TOPIC:rentals.events}
    dead-letter-topic: ${RENT_MESSAGING_DLT:rentals.events.recommendations.DLT}
    retry:
      max-retries: ${RECOMMENDATIONS_MAX_RETRIES:3}
      initial-interval-ms: ${RECOMMENDATIONS_RETRY_INTERVAL_MS:1000}
  archive:
    enabled: ${HDFS_ARCHIVE_ENABLED:false}
    url: ${HDFS_HTTPFS_URL:http://localhost:14000}
    user: ${HDFS_USER:hadoop}
    root: ${HDFS_ARCHIVE_ROOT:/rent-cars/raw/rentals}
